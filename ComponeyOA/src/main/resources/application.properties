# 1. 应用服务 WEB 访问端口
server.port=8080

# 2. 数据库数据源配置 (连接池默认使用 HikariCP)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/componeyoa?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# 3. MyBatis 核心配置
# 开启驼峰命名自动映射 (dept_id -> deptId，避免查询字段全为 null)
mybatis.configuration.map-underscore-to-camel-case=true

# 控制台打印执行的真实 SQL 语句与参数 (方便调试排错)
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 实体类扫描包路径 (修正为实际的 entity 包)
mybatis.type-aliases-package=org.example.componeyoa.entity

# 如果纯注解开发，这行可以注释；若后续要写 XML 则保留
# mybatis.mapper-locations=classpath:mappers/*xml